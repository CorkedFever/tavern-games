# Builds the relay server's image and publishes it to ghcr.io/corkedfever/tavern-relay,
# which meteor pulls. Runs when the server or the rules it hosts change on main, or by hand.
# The tests go first: an image is only published for code that passes them.

name: Relay image

on:
  push:
    branches: [main]
    paths:
      - "src/TavernGames.Core/**"
      - "src/TavernGames.Server/**"
      - "tests/**"
      - "deploy/Dockerfile"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The plugin project needs Dalamud's libraries and isn't part of the server, so the two
      # test projects are run on their own rather than through the solution.
      - run: dotnet test tests/TavernGames.Core.Tests/TavernGames.Core.Tests.csproj -c Release
      - run: dotnet test tests/TavernGames.Server.Tests/TavernGames.Server.Tests.csproj -c Release

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/corkedfever/tavern-relay:latest
            ghcr.io/corkedfever/tavern-relay:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/CorkedFever/tavern-games
            org.opencontainers.image.description=The Tavern Games relay server
          cache-from: type=gha
          cache-to: type=gha,mode=max
